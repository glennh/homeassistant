# XIAO ESP32-C6 + INMP441 mic: reports loudness to Home Assistant.
esphome:
  name: esphome-cat
  friendly_name: ESPHome cat

esp32:
  variant: esp32c6
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG

api:

ota:
  - platform: esphome

# The board sits where it can only reach the extender, but both are listed so it
# can use whichever signal is better.
wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
    - ssid: !secret wifi_ssid_ext
      password: !secret wifi_password
  ap:
    ssid: "esphome-cat Fallback"
    password: !secret fallback_ap_password

i2s_audio:
  i2s_lrclk_pin: GPIO1   # INMP441 WS
  i2s_bclk_pin: GPIO0    # INMP441 SCK

microphone:
  - platform: i2s_audio
    id: door_mic
    adc_type: external
    i2s_din_pin: GPIO2   # INMP441 SD
    pdm: false
    channel: left        # INMP441 L/R wired to GND

sensor:
  - platform: sound_level
    microphone: door_mic
    passive: false
    rms:
      name: "Average Loudness"
    peak:
      name: "Peak Loudness"
