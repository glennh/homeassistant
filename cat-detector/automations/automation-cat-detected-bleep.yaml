# Exported from Home Assistant: automation.cat_detected_bleep
# config id: 1792440123574 (UI-managed; the id keeps this in sync with HA)
#
# DORMANT: the mic is not in use, and the ESPHome cat device is not in HA, so this
# automation's mic/radar entities (sensor.esphome_cat_peak_loudness,
# binary_sensor.esphome_cat_radar_target) do not exist. The Snug flasher/bleeper
# switch does exist, but this automation does not run. Kept as an export of what
# is still stored in HA; it last fired 2026-10-28.

alias: Cat detected - bleep
description: >-
  Starts the Snug flasher and bleeper when the mic peaks loudly, but only if the
  radar has seen a target continuously for the last 10 seconds (presence first,
  then sound). Keeps going until the physical button is pressed, then ignores
  triggers for 1 minute. Thresholds need fine tuning.
id: "1792440123574"
triggers:
  - trigger: numeric_state
    entity_id: sensor.esphome_cat_peak_loudness
    above: -40
conditions:
  - condition: state
    entity_id: binary_sensor.esphome_cat_radar_target
    state: "on"
    for:
      hours: 0
      minutes: 0
      seconds: 5
  # Second gate: button pressed within the last minute disables the bleep.
  # Currently disabled in HA (enabled: false).
  - condition: state
    entity_id: binary_sensor.snug_flasher_bleaper_button
    state: "off"
    for:
      minutes: 1
    enabled: false
actions:
  - action: switch.turn_on
    target:
      entity_id: switch.snug_flasher_bleaper_flasher_enabled
mode: single
